[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tagarnina"
dynamic = ["version"]
description = "Constrained Feature Selection"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Guillermo Navas-Palencia", email = "g.navas-palencia@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas",
    "ortools",
    "scikit-learn"
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "ortools.*", "scipy.*"]
ignore_missing_imports = true

[tool.setuptools.dynamic]
version = { attr = "tagarnina.__version__" }

[tool.setuptools.packages.find]
include = ["tagarnina*"]
