[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tagarnina"
dynamic = ["version"]
description = "Constrained Feature Selection"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Guillermo Navas-Palencia", email = "g.navas-palencia@gmail.com" },
]
keywords = [
    "feature selection",
    "recursive feature elimination",
    "constraints",
    "CP-SAT",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "ortools",
    "scikit-learn"
]

[project.urls]
Homepage = "https://gnpalencia.org/tagarnina/"
Documentation = "https://gnpalencia.org/tagarnina/"
Repository = "https://github.com/guillermo-navas-palencia/tagarnina"
Issues = "https://github.com/guillermo-navas-palencia/tagarnina/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
docs = ["sphinx", "pydata-sphinx-theme", "numpydoc", "sphinx-gallery", "matplotlib", "shap"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Sphinx-gallery examples place imports next to the code and text that uses them.
"examples/*" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = false

[[tool.mypy.overrides]]
module = ["sklearn.*", "pandas.*", "ortools.*", "scipy.*"]
ignore_missing_imports = true

[tool.setuptools.dynamic]
version = { attr = "tagarnina.__version__" }

[tool.setuptools.packages.find]
include = ["tagarnina*"]
